<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8"><link rel="icon" href="../../assets/mark.svg">
<title>BIGZ · Slagaonica — 606 listova arhive kao prostor</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { --papir: #e8dcc4; --mastilo: #0b0806; --akcenat: #d8a25a; --pozadina: #0b0806; }
  html, body { margin: 0; height: 100%; background: var(--mastilo); color: var(--papir); font: 14px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .hud { position: fixed; pointer-events: none; }
  .naslov { left: 28px; top: 24px; }
  .naslov h1 { margin: 0; font: 400 clamp(22px, 3vw, 34px)/1.05 Georgia, "Times New Roman", serif; letter-spacing: .01em; }
  .naslov h1 em { font-style: italic; color: var(--akcenat); }
  .naslov p { margin: 8px 0 0; opacity: .72; font-variant-numeric: tabular-nums; max-width: 46ch; }
  .karta { left: 28px; bottom: 24px; max-width: 54ch; opacity: 0; transition: opacity 180ms; border-left: 1px solid var(--akcenat); padding-left: 12px; }
  .karta b { font-weight: 400; color: var(--akcenat); }
  .karta small { opacity: .6; display: block; margin-top: 4px; word-break: break-all; }
  .legenda { right: 28px; bottom: 24px; text-align: right; opacity: .72; font-variant-numeric: tabular-nums; }
  .legenda span { display: inline-block; width: 9px; height: 9px; vertical-align: middle; margin: 0 6px 0 14px; background: var(--papir); }
  .legenda span.d { background: transparent; border: 1px solid var(--akcenat); }
  @media (max-width: 600px) { .legenda { display: none; } .naslov p { max-width: 30ch; } .karta { max-width: 80vw; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="zavesa" style="position:fixed;inset:0;display:grid;place-items:center;background:var(--pozadina);font-size:12px;letter-spacing:.08em;text-transform:uppercase;z-index:9">učitavam slike…</div>
<div class="hud naslov"><h1>BIGZ · <em>Slagaonica</em></h1><p id="opis">učitavam listove…</p></div>
<div class="hud karta" id="karta"></div>
<div class="hud legenda"><span></span>pročitan list<span style="opacity:.45"></span>nepročitan<span class="d"></span>nit do datuma</div>
<script>addEventListener("error",e=>{document.getElementById("opis").textContent="GRESKA: "+e.message+" @"+(e.filename||"")+":"+e.lineno});addEventListener("unhandledrejection",e=>{document.getElementById("opis").textContent="GRESKA(promise): "+(e.reason&&e.reason.message||e.reason)});</script>
<script type="module">
import * as THREE from './vendor/three.module.js';
import { ucitaj, ploce, postaviInstancu, hud, reducedMotion, renderer as mkRenderer, pmrem, raspored, osaRaspored, galerija, kocka } from './foto.js';
import { navigacija } from './nav.js';
import { kontrole, izUpita } from './ui.js';

// ——— rečenica sveta: arhiva štamparije je slog; svaka fascikla je kaseta, svaki list stoji u svojoj kaseti,
// pročitan list je izvučen napolje, a datiran list drži nit do svog dana na šini vremena. Forma = ono što o listu znamo.
const canvas = document.getElementById('c');
const r = mkRenderer(canvas); r.toneMappingExposure = 1.15;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0806);
scene.fog = new THREE.FogExp2(0x0b0806, 0.028);
const cam = new THREE.PerspectiveCamera(36, 1, 0.1, 200);
pmrem(r, scene, [0x3a2a18, 0x16100a, 0x040302]);
const key = new THREE.DirectionalLight(0xffd6a0, 2.6); key.position.set(-9, 11, 7); scene.add(key);
scene.add(new THREE.HemisphereLight(0x4a3621, 0x050403, 0.55));

const { json, tex } = await ucitaj('bigz');
const items = json.items;

// kasete: fascikla → redosled po obimu (veća bliže sredini luka)
const poF = new Map();
items.forEach((it, i) => { const f = (it.bigz && it.bigz.fascikla) || '— bez fascikle'; if (!poF.has(f)) poF.set(f, []); poF.get(f).push(i); });
const fasc = [...poF.entries()].sort((a, b) => b[1].length - a[1].length);
// raspored kaseta: naizmenično levo/desno od sredine luka, da najobimnije budu u centru
const red = []; fasc.forEach((f, k) => (k % 2 ? red.push(f) : red.unshift(f)));
const R = 17, span = Math.PI * 0.86;
const spot = new THREE.SpotLight(0xffc98a, 60, 40, 0.9, 0.6, 1.4); spot.position.set(0, 9, -R + 9); spot.target.position.set(0, 0, -R + 5); scene.add(spot, spot.target);
const { mesh, lift, U, jacina } = ploce(items, tex, { podloga: 0xffffff, curl: 1, relief: 0.14, akcenat: 0xd8a25a, material: { roughness: 0.86, envMapIntensity: 0.5 } });
const A = new Array(items.length); // raspored sveta: {p,w,h,ry,rx} po listu
const tint = mesh.geometry.getAttribute('tint');
const pos = new THREE.Vector3(), poz = new Array(items.length);
const godine = []; // [i, datum]
red.forEach(([f, idx], k) => {
  const a = -span / 2 + span * (k + 0.5) / red.length;          // ugao kasete na luku
  const dir = new THREE.Vector3(Math.sin(a), 0, -Math.cos(a));     // radijalno od posmatrača ka zidu
  const tan = new THREE.Vector3(-dir.z, 0, dir.x);
  // listovi stoje jedan iza drugog u kaseti (kartoteka), razmak 0.11; pročitani izvučeni napred i gore
  idx.sort((p, q) => ((items[q].bigz || {}).procitano ? 1 : 0) - ((items[p].bigz || {}).procitano ? 1 : 0));
  idx.forEach((i, j) => {
    const it = items[i], b = it.bigz || {};
    const odnos = Math.min(1.6, Math.max(0.55, it.ose.odnos));
    const h = 1.0, w = h * odnos;
    const dubina = j * 0.11;
    const p = dir.clone().multiplyScalar(R - 4.5 + dubina).addScaledVector(tan, (Math.random() - 0.5) * 0.06);
    p.y = 0.55 + h / 2 + (b.procitano ? 0.38 : 0) + (Math.random() - 0.5) * 0.02;
    poz[i] = p.clone();
    const ry = a + (Math.random() - 0.5) * 0.08; A[i] = { p: p.clone(), w, h, ry, rx: 0 };
    postaviInstancu(mesh, i, p, w, h, ry, 0);
    const t = b.procitano ? 1.0 : 0.42; tint.setXYZ(i, t, t * 0.985, t * 0.95);
    jacina.setX(i, b.procitano ? 1 : 0.15);
    if (b.datum) godine.push([i, b.datum]);
  });
});
tint.needsUpdate = true; jacina.needsUpdate = true; mesh.instanceMatrix.needsUpdate = true;
scene.add(mesh);

// pod: tamna ploča koja hvata svetlo
const pod = new THREE.Mesh(new THREE.CircleGeometry(60, 64), new THREE.MeshStandardMaterial({ color: 0x1c1610, roughness: 0.9, metalness: 0 }));
pod.rotation.x = -Math.PI / 2; scene.add(pod);

// šina vremena: 1934–1941 na luku bliže posmatraču; datirani listovi spuštaju nit do svog dana
const t0 = Date.parse('1934-01-01'), t1 = Date.parse('1941-12-31');
const Rt = R - 7.6;
const sinaPts = [];
for (let s = 0; s <= 96; s++) { const a = -span / 2 + span * s / 96; sinaPts.push(new THREE.Vector3(Math.sin(a) * Rt, 0.02, -Math.cos(a) * Rt)); }
scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(sinaPts), new THREE.LineBasicMaterial({ color: 0xd8a25a, transparent: true, opacity: 0.55 })));
const nitPts = [], godPts = [];
godine.forEach(([i, d]) => {
  const t = (Date.parse(d) - t0) / (t1 - t0); if (!(t >= 0 && t <= 1)) return;
  const a = -span / 2 + span * t;
  const q = new THREE.Vector3(Math.sin(a) * Rt, 0.02, -Math.cos(a) * Rt);
  const pod0 = poz[i].clone().setY(0.02); nitPts.push(poz[i].clone().setY(poz[i].y - 0.5), pod0, pod0, q); godPts.push(q);
});
scene.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(nitPts), new THREE.LineBasicMaterial({ color: 0xd8a25a, transparent: true, opacity: 0.28 })));
const god = new THREE.Points(new THREE.BufferGeometry().setFromPoints(godPts), new THREE.PointsMaterial({ color: 0xffe0b0, size: 0.09 })); scene.add(god);
// oznake godina u DOM-u (tekst nikad u WebGL-u)
const godEl = [];
for (let y = 1934; y <= 1941; y++) {
  const el = document.createElement('div'); el.className = 'hud'; el.style.cssText = 'font-size:11px;opacity:.6;transform:translate(-50%,0)'; el.textContent = y; document.body.appendChild(el);
  const t = (Date.parse(y + '-01-01') - t0) / (t1 - t0), a = -span / 2 + span * t;
  godEl.push([el, new THREE.Vector3(Math.sin(a) * Rt, 0.0, -Math.cos(a) * Rt)]);
}

const procitano = items.filter(i => i.bigz && i.bigz.procitano).length;
document.getElementById('opis').textContent = `${items.length} listova u ${red.length} kaseta · ${procitano} pročitano · ${godPts.length} sa datumom na šini 1934–1941 · arhiv B.I.G.Z. — originali čuvani, ovde sličice 160 px`;

// kamera: blaga vožnja duž luka (Tura); Orbit i Hod preuzimaju na prvi dodir (nav.js)
const target = new THREE.Vector3(0, 0.9, -R + 5.2);
function kamera(t) {
  const a = reducedMotion ? 0 : Math.sin(t * 0.045) * 0.42;
  cam.position.set(Math.sin(a) * 5.5, 3.9 + Math.sin(t * 0.09) * 0.1, -R + 6 + Math.cos(a) * 10.5);
  cam.lookAt(target);
}
let queued = false; const trazi = () => { if (!queued) { queued = true; requestAnimationFrame(tick); } };
const nav = navigacija(cam, canvas, { meta: target, tura: kamera, brzina: 4, minY: 0.3, minR: 1.2, maxR: 70, probudi: trazi, naPromenu: m => ui.oznaciMod(m) });
// prostor osa: svaki list po rangu hue × svetlina × zasićenje (oblak sličnosti); isti listovi, isti draw call
const cOblak = new THREE.Vector3(0, 4.9, -R + 6), szOblak = [16, 7.5, 9];
const B = osaRaspored(items, A, cOblak, szOblak, 0.8);
// galerija: hodnik kroz kartoteku — kaseta redom sa luka na zidovima, pročitani listovi izdignuti na visinu oka
const GAL = galerija(items, { redovi: red.map(([f, idx]) => [f, idx]), c: new THREE.Vector3(0, 0, -R + 26), sirina: 6.5, visina: 0.95, razmak: 1.05, vrata: 1.8,
  visinaIt: (it, oko0) => oko0 + ((it.bigz || {}).procitano ? 0.35 : 0) });
const rasp = raspored(mesh, [A, B, GAL.B], cam);
const oko = kocka(scene, cOblak, szOblak, 0xd8a25a, ['hue', 'svetlina', 'zasićenje']);
const rasporedFn = i => {
  rasp.postavi(i);
  if (i === 2) { nav.postaviSudar({ kutije: GAL.kutije, r: 0.32, visinaOka: 1.55 }); cam.position.copy(GAL.ulaz); cam.rotation.set(0, -Math.PI / 2, 0, 'YXZ'); nav.mode('hod'); }
  else { nav.postaviSudar(null); if (i) nav.fokus(cOblak, 23); else nav.mode('tura'); }
  trazi();
};
const ui = kontrole({ nav, sloj: i => { U.sloj(i); trazi(); }, probudi: trazi,
  nazivRasporeda: ['Svet', 'Prostor osa', 'Galerija'],
  rasporedFn,
  pomoc: '<b>Kretanje</b> · Orbit: prevlačenje okreće, desni klik (ili Shift) pomera, točkić zumira · Hod: WASD, prevlačenje pogleda, Q/E dole/gore, Shift brže · dvoklik na list ga fokusira.<br><b>Sloj</b> · ivice = Sobel nad sličicom; relijef = svetlina pomera mrežu; raster = polutonski krug na 5 px; sve = relijef + ivice.<br><b>Prostor osa</b> · x hue, y svetlina, z zasićenje, po rangu.<br><b>Galerija</b> · hodnik kroz kartoteku, kaseta redom sa luka; pročitani listovi izdignuti — hodaš pored zida od listova.' });
// hover: list se izvlači ka posmatraču, kartica u DOM-u; dodir bira list
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(-2, -2); let hover = -1;
const pomeri = e => { mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); };
addEventListener('pointermove', e => { pomeri(e); if (reducedMotion) trazi(); });
canvas.addEventListener('pointerdown', e => { pomeri(e); trazi(); });
canvas.addEventListener('dblclick', e => {
  pomeri(e); ray.setFromCamera(mouse, cam); const hit = ray.intersectObject(mesh, false)[0]; if (!hit) return;
  const m = new THREE.Matrix4(); mesh.getMatrixAt(hit.instanceId, m); nav.fokus(new THREE.Vector3().setFromMatrixPosition(m), 2.6);
});
const karta = document.getElementById('karta');
function kartica(i) {
  if (i < 0) return hud(karta, '');
  const it = items[i], b = it.bigz || {};
  hud(karta, `<b>${b.fascikla || '—'}</b> · ${b.vrsta || 'vrsta nepoznata'}${b.datum ? ' · ' + b.datum : ''}<br>${b.naslov || (b.procitano ? '' : 'nepročitan list')}<small>${it.izvor}${it.u_izvoru ? ' :: ' + it.u_izvoru : ''} · ${it.ose.w}×${it.ose.h} · svetlina ${it.ose.svetlina}</small>`);
}
function resize() { const w = innerWidth, h = innerHeight; r.setSize(w, h, false); cam.aspect = w / h; cam.fov = cam.aspect < 1 ? 54 : 36; cam.updateProjectionMatrix(); /* portret (telefon): širi ugao */ trazi(); }
addEventListener('resize', resize);
const clock = new THREE.Clock(); let frame = 0, prev = 0;
function tick() {
  queued = false;
  const t = clock.getElapsedTime(), dt = Math.min(0.1, t - prev); prev = t; frame++;
  const brz = reducedMotion ? 10 : 1;
  nav.update(dt, t);
  U.uTime.value = t;
  const gibanje = U.glatko(dt * brz), prelaz = rasp.tick(dt * brz);
  if (frame % 2 === 0 || prelaz) {
    ray.setFromCamera(mouse, cam); const hit = ray.intersectObject(mesh, false)[0];
    const id = hit ? hit.instanceId : -1;
    if (id !== hover) { if (hover >= 0) lift[hover] = 0; hover = id; if (hover >= 0) lift[hover] = 1; mesh.geometry.getAttribute('lift').needsUpdate = true; kartica(hover); }
  }
  oko.azuriraj(cam, rasp.t > 0.02);
  godEl.forEach(([el, p]) => { const v = p.clone().project(cam); el.style.left = (v.x + 1) / 2 * innerWidth + 'px'; el.style.top = (1 - v.y) / 2 * innerHeight + 4 + 'px'; el.style.display = v.z < 1 && rasp.t < 0.5 ? '' : 'none'; });
  r.render(scene, cam);
  if (!reducedMotion || frame < 3 || nav.aktivan() || gibanje || prelaz) trazi();
}
resize(); izUpita({ U, ui, rasp, nav, cOblak, razmak: 23, trazi, rasporedFn }); tick(); ui.spremno();
window.__svet = { cam, nav, ui, U, rasp, trazi, items: items.length, kaseta: red.length, procitano, datirano: godPts.length, galerija: { kutije: GAL.kutije, ulaz: GAL.ulaz.toArray(), duzina: GAL.duzina }, rasporedFn, drawCalls: () => r.info.render.calls };
</script>
</body>
</html>
