name: Validate course data and projections
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/atlas-build.cjs
      - run: node --test docs/tests/architecture.test.cjs docs/tests/atlas.test.cjs docs/tests/intake.test.cjs docs/tests/privacy.test.cjs
      - run: node docs/validate.cjs
      - run: git diff --exit-code -- docs
